name: Link oku

# Bir video linkini indirir, kareler + konuşma dökümü + açıklama metnini
# linkler/ klasörüne kaydeder. İki şekilde çalışır:
#  1) Actions sekmesi > "Link oku" > Run workflow > linki yapıştır
#  2) Yeni bir Issue aç, başlığına veya içine linki yapıştır
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video linki (Instagram, TikTok, YouTube...)"
        required: true
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: link-oku
  cancel-in-progress: false

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Linki bul
        id: link
        env:
          GIRDI: ${{ github.event.inputs.url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          METIN="$GIRDI $ISSUE_TITLE $ISSUE_BODY"
          URL=$(printf '%s' "$METIN" | grep -oE 'https?://[^[:space:]<>"]+' | head -n1 || true)
          if [ -z "$URL" ]; then echo "Link bulunamadı"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper

      - name: İsteğe bağlı Instagram çerezleri
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          if [ -n "$IG_COOKIES" ]; then
            printf '%s' "$IG_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Linki işle
        id: isle
        env:
          URL: ${{ steps.link.outputs.url }}
        run: python scripts/link_isle.py "$URL"

      - name: Sonucu kaydet
        env:
          URL: ${{ steps.link.outputs.url }}
        run: |
          git config user.name "link-oku-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkler
          git commit -m "Link işlendi: $URL"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Issue'ya yaz
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          KLASOR: ${{ steps.isle.outputs.klasor }}
          DURUM: ${{ job.status }}
        with:
          script: |
            const ok = process.env.DURUM === 'success' && process.env.KLASOR;
            const body = ok
              ? `Hazır ✅ Sonuç: \`${process.env.KLASOR}\`\n\nClaude'a "son linke bak" demen yeterli.`
              : `İşlenemedi ❌ Ayrıntı: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            if (ok) await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });
